<div class="card-wrapper" (click)="verDetalle()">
  
  <div class="game-card">
    <img class="bg-image" [src]="getCoverUrl(game.cover)" [alt]="game.name" loading="lazy">
    
    <div class="hover-overlay"></div>

    <div class="game-info">
      <h3 class="title">{{ game.name }}</h3>
    </div>

    @if (showAddButton) {
      <button class="add-btn-overlay" (click)="onAddClick($event)">
        <i class="bi bi-plus-lg"></i> Añadir
      </button>
    }
  </div>

</div>
