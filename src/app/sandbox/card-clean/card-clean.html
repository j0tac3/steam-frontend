<!-- 🚀 AÑADIMOS LA CLASE DE DESPEDIDA AL CONTENEDOR PRINCIPAL -->
<div class="card-wrapper" (click)="verDetalle()" [class.is-leaving]="isLeaving()">
  <div class="game-card">
    <img class="bg-image" [src]="imageUrl()" [alt]="title()" loading="lazy">
    
    <div class="gradient-overlay"></div>
    
    @if (context() === 'search') {
      @if (showAddButton()) {
        <button class="fab-add-btn" (click)="onAddClick($event)" aria-label="Añadir a biblioteca">
          <i class="bi bi-plus"></i>
        </button>
      } @else {
        <div class="fab-added-badge" title="Ya en tu colección">
          <i class="bi bi-check2"></i>
        </div>
      }
    } @else if (context() === 'library') {
      <button class="fab-options-btn" (click)="onOptionsClick($event)" aria-label="Opciones del juego">
        <i class="bi bi-three-dots-vertical"></i>
      </button>
      
      @if (status() === 'jugando') {
        <!-- 🚀 AÑADIMOS LA CLASE DEL LATIDO AL TROFEO -->
        <button class="fab-complete-btn" [class.pop-anim]="isPopping()" (click)="onCompleteClick($event)" title="¡Me lo he pasado!">
          <i class="bi bi-trophy-fill"></i>
        </button>
      }
    }

    <!-- Sustituye el <div class="game-info"> actual por este: -->
    <div class="game-info">
      <div class="d-flex justify-content-between align-items-start">
        <h3 class="title mb-0">{{ title() }}</h3>
        
        <!-- ❤️ FASE 4: Corazón de favorito -->
        @if (isFavorite()) {
          <i class="bi bi-heart-fill text-danger ms-1" style="filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));"></i>
        }
      </div>

      <!-- ⭐ FASE 4: Estrellas de puntuación personal -->
      @if (personalRating() > 0) {
        <div class="text-warning mt-1" style="font-size: 0.75rem; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));">
          @for (star of [2,4,6,8,10]; track star) {
            <i class="bi" 
               [class.bi-star]="personalRating() < star - 1"
               [class.bi-star-half]="personalRating() === star - 1"
               [class.bi-star-fill]="personalRating() >= star"></i>
          }
        </div>
      }
    </div>
  </div>
</div>
