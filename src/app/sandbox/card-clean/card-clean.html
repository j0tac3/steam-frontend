<div class="game-card" (click)="verDetalle()">
  
  <!-- Imagen de fondo que ocupa toda la tarjeta -->
  <img class="bg-image" [src]="getCoverUrl(game.cover)" [alt]="game.name" loading="lazy">
  
  <!-- Sombra inferior para dar legibilidad al texto -->
  <div class="gradient-overlay"></div>

  <!-- Zona Superior: Indicadores y Botón -->
  <div class="top-controls">
    <div class="left-group">
      <div class="status-dot"></div>
      <div class="platform-badge">{{ getPlatformBadge() }}</div>
    </div>
    
    <button class="favorite-btn" (click)="toggleFavorite($event)">
      <!-- Ajusta estas clases si usas FontAwesome (ej: fas fa-heart) -->
      <i class="bi" [ngClass]="isFavorite ? 'bi-heart-fill active' : 'bi-heart'"></i>
    </button>
  </div>

  <!-- Zona Inferior: Título y Estrellas -->
  <div class="bottom-info">
    <h3 class="title">{{ game.name }}</h3>
    
    <div class="stars-container">
      @for (star of [1, 2, 3, 4, 5]; track star) {
        <i class="bi bi-star-fill star-icon" [class.filled]="isStarFilled(star)"></i>
      }
    </div>
  </div>

</div>
