<div class="card-wrapper" (click)="verDetalle()">
  <div class="game-card">
    <img class="bg-image" [src]="imageUrl()" [alt]="title()" loading="lazy">
    
    <!-- Degradado progresivo solo en la base -->
    <div class="gradient-overlay"></div>
    
    <!-- Botón FAB (Floating Action Button) esquina superior derecha -->
    @if (showAddButton()) {
      <button class="fab-add-btn" (click)="onAddClick($event)" aria-label="Añadir a biblioteca">
        <i class="bi bi-plus"></i>
      </button>
    } @else {
      <!-- Check de "Ya en colección" -->
      <div class="fab-added-badge" title="Ya en tu colección">
        <i class="bi bi-check2"></i>
      </div>
    }

    <!-- Título en la base -->
    <div class="game-info">
      <h3 class="title">{{ title() }}</h3>
    </div>
  </div>
</div>
