<div class="sandbox-container p-4 animate__animated animate__fadeIn">
  
  <!-- Cabecera -->
  <div class="d-flex justify-content-between align-items-end mb-5 pb-3 border-bottom border-white border-opacity-10">
    <div>
      <h2 class="text-white fw-bold m-0">🧪 Laboratorio de UI</h2>
      <p class="text-white-50 small m-0">Probando nuevos diseños sin afectar a producción</p>
    </div>

    <!-- 🚀 NUEVO: Barra de Búsqueda -->
    <div class="search-box-glass">
      <i class="bi bi-search search-icon"></i>
      <input 
        type="text" 
        [formControl]="buscador" 
        placeholder="Buscar juego..." 
        class="search-input">
    </div>

    <div class="view-switcher-glass p-1 d-flex gap-1">
      <button class="btn-view" [class.active]="tipoVista() === 'clean'" (click)="cambiarVista('clean')">
        <i class="bi bi-grid-fill"></i>
      </button>
    </div>
  </div>

  <!-- Rejilla de Juegos -->
  <div class="juegos-grid-container">
    @for (juego of misJuegos(); track juego.id) {
      <div class="grid-item">
        <app-card-clean [game]="juego" (clicked)="abrirModal($event)"></app-card-clean>
      </div>
    } @empty {
      <!-- 🚀 Mensaje si no hay resultados -->
      <div class="text-center w-100 py-5">
        <p class="text-white-50">Escribe al menos 3 letras para buscar en IGDB...</p>
      </div>
    }
  </div>

  @if (juegoSeleccionado()) {
    <app-modal-v2 
        [gameId]="juegoSeleccionado()!" 
        (close)="juegoSeleccionado.set(null)">
    </app-modal-v2>
  }
</div>
