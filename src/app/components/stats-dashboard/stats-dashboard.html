<div class="main-container min-vh-100 pb-5">
  
  <nav class="navbar navbar-dark sticky-top glass-navbar mb-4 py-3">
    <div class="container d-flex justify-content-start align-items-center">
      
      <div class="d-flex align-items-center brand-container me-4">
        <span class="fs-2 me-2 brand-icon text-primary"><i class="bi bi-gamepad"></i></span>
        <h2 class="text-white m-0 fs-4 fw-black tracking-wide brand-text d-none d-md-block">ADN Gamer</h2>
      </div>

      <div class="d-flex align-items-center bg-white bg-opacity-10 rounded-pill p-1 border border-white border-opacity-10 shadow-sm overflow-auto">
        <a routerLink="/biblioteca" routerLinkActive="btn-primary text-white" [routerLinkActiveOptions]="{exact: true}" class="btn btn-sm text-white-50 rounded-pill px-3 fw-bold text-decoration-none text-nowrap hover-white">
          <i class="bi bi-collection-play-fill me-1"></i> Colección
        </a>
        <a routerLink="/descubrir" routerLinkActive="btn-primary text-white" class="btn btn-sm text-white-50 rounded-pill px-3 fw-bold text-decoration-none text-nowrap hover-white">
          <i class="bi bi-compass-fill me-1"></i> Descubrir
        </a>
        <a routerLink="/estadisticas" routerLinkActive="btn-primary text-white" class="btn btn-sm text-white-50 rounded-pill px-3 fw-bold text-decoration-none text-nowrap hover-white">
          <i class="bi bi-pie-chart-fill me-1"></i> Mi ADN
        </a>
      </div>

    </div>
  </nav>

  <main class="container">
    @if (loading()) {
      <div class="d-flex justify-content-center align-items-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
      </div>
    } @else {
      <div class="glass-panel p-5 rounded-4 mb-4 text-center">
        <h5 class="text-white-50 fw-bold mb-2 tracking-wide text-uppercase">Total de la Colección</h5>
        <h1 class="display-1 fw-black text-white m-0" style="text-shadow: 0 0 20px rgba(255,255,255,0.2);">
          {{ totalGames() }}
        </h1>
        <p class="text-white-50 mt-2">Títulos registrados en tu historial</p>
      </div>

      <div class="row g-4">
        
        <div class="col-lg-4">
          <div class="glass-panel p-4 rounded-4 h-100 d-flex flex-column">
            <h5 class="text-white fw-bold mb-4"><i class="bi bi-trophy text-warning me-2"></i> Estado del Backlog</h5>
            <div style="flex-grow: 1; min-height: 250px; position: relative;">
              <canvas id="statusChart"></canvas>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="glass-panel p-4 rounded-4 h-100 d-flex flex-column">
            <h5 class="text-white fw-bold mb-4"><i class="bi bi-controller text-info me-2"></i> Ecosistemas</h5>
            <div style="flex-grow: 1; min-height: 250px; position: relative;">
              <canvas id="platformsChart"></canvas>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="glass-panel p-4 rounded-4 h-100 d-flex flex-column">
            <h5 class="text-white fw-bold mb-4"><i class="bi bi-controller text-primary me-2"></i> Top Géneros</h5>
            <div style="flex-grow: 1; min-height: 250px; position: relative;">
              <canvas id="genresChart"></canvas>
            </div>
          </div>
        </div>

      </div>
    }
  </main>
</div>
