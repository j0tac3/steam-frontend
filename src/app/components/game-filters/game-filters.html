<div class="search-section d-flex flex-column gap-3 mb-2">
  
  <div class="search-wrapper position-relative">
    <span class="search-icon d-flex align-items-center">
      <app-icon name="icon-search"></app-icon>
    </span>
    
    <input 
      type="text" 
      class="form-control custom-search-input shadow-sm" 
      placeholder="Filtrar por nombre..."
      [value]="filtroTexto()"
      (input)="textoCambiado.emit($any($event.target).value)">
    
    @if (filtroTexto()) {
      <button class="btn-clear" (click)="limpiarBusqueda()" title="Limpiar búsqueda">×</button>
    }
    
    <div class="results-counter">
      <strong class="text-white">{{ totalMostrados() }}</strong> {{ totalMostrados() === 1 ? 'juego' : 'juegos' }}
    </div>
  </div>

  <div class="mt-2">
    <label class="text-white-50 small mb-2 fw-bold text-uppercase">Plataforma</label>
    <select class="form-select bg-dark text-white border-secondary shadow-none"
            [value]="filtroPlataforma()"
            (change)="plataformaCambiada.emit($any($event.target).value)">
      <option value="todas">🌌 Todas las plataformas</option>
      <option value="PC">💻 PC (Steam/Epic)</option>
      <option value="PS5">🎮 PlayStation</option>
      <option value="Xbox">🟢 Xbox</option>
      <option value="Switch">🔴 Nintendo Switch</option>
      <option value="Mobile">📱 Móvil</option>
    </select>
  </div>

</div>
