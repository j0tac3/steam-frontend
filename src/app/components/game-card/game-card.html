<div class="card h-100 game-card border-0 shadow-sm" [attr.data-status]="game.status">
  <div class="img-container" 
       [class.bg-blur-effect]="game.source === 'steam'"
       [style.--bg-image]="'url(' + (game.cover_url || '/no-image.svg') + ')'"
       (click)="onVerInfo()">
       
    <div class="blur-layer"></div>
    
    @if (game.platform) {
      <div class="platform-badge" [attr.data-platform]="game.platform">
        @switch (game.platform) {
          @case ('PC') { <app-icon name="icon-pc"></app-icon> }
          @case ('PS5') { <app-icon name="icon-ps"></app-icon> }
          @case ('Xbox') { <app-icon name="icon-xbox"></app-icon> }
          @case ('Switch') { <app-icon name="icon-switch"></app-icon> }
          @default { <app-icon name="icon-pc"></app-icon> }
        }
      </div>
    }

    <!-- 🚀 Usamos la nueva propiedad cover_url -->
    <img [src]="game.cover_url || '/no-image.svg'" class="main-img" alt="Portada">
  </div>
  
  <div class="card-body p-3 d-flex flex-column">
    <h6 class="fw-bold text-truncate mb-1 text-white" [title]="game.title">{{ game.title }}</h6>
    
    <div class="text-warning mb-3" style="font-size: 0.9rem;">
      {{ generarEstrellas(game.personal_rating) }}
    </div>

    <div class="mt-auto">
      <select class="form-select form-select-sm mb-2 border-light fw-bold" 
              [value]="game.status" (change)="onCambiarEstado($event)">
        <option value="pendiente">⏳ Pendiente</option>
        <option value="jugando">🎮 Jugando</option>
        <option value="completado">🏆 Completado</option>
        <option value="abandonado">❌ Abandonado</option>
      </select>
      <div class="d-flex gap-2">
        <button class="btn btn-primary btn-sm flex-grow-1 align-items-center gap-2 d-flex justify-content-center"
                (click)="onVerInfo()">
          <app-icon name="icon-info"></app-icon>
          <span>Info</span>
        </button>
        <button class="btn btn-danger text-white border-0 shadow d-flex align-items-center justify-content-center" 
                (click)="onBorrar()" 
                title="Eliminar juego">
          <app-icon name="icon-trash"></app-icon>
        </button>
      </div>
    </div>
  </div>
</div>
