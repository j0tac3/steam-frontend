<div class="stats-glass-card mb-4 w-100" [class.is-collapsed]="!isExpanded()">
  
  <div class="header-area" (click)="togglePanel()">
    <div class="d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-2">
        <h3 class="m-0 text-white fw-bold">Mi Colección</h3>
        <span class="fs-4 brand-icon-glow" style="color: #8a3aff; line-height: 1;">
          <app-icon name="icon-layers"></app-icon>
        </span>
      </div>
      
      <div class="trigger-icon">
        <i class="bi" [class.bi-chevron-down]="!isExpanded()" [class.bi-chevron-up]="isExpanded()"></i>
      </div>
    </div>
    
    <p class="m-0 small mt-1 summary-subtitle">
      Total: <strong style="color: #8a3aff; font-size: 1.15em; text-shadow: 0 0 10px rgba(138,58,255,0.3);">{{ total() }}</strong> juegos 
      <span class="fs-7 opacity-50 ms-2 d-none d-sm-inline">
        @if (isExpanded()) { (clic para ocultar) } @else { (clic para expandir) }
      </span>
    </p>
  </div>

  <div class="premium-progress">
    <div class="bar success" [style.width]="calcularPorcentaje(completados())"></div>
    <div class="bar primary" [style.width]="calcularPorcentaje(jugando())"></div>
    <div class="bar warning" [style.width]="calcularPorcentaje(pendientes())"></div>
    <div class="bar danger" [style.width]="calcularPorcentaje(abandonados())"></div>
  </div>

  <div class="panel-collapsible" [class.open]="isExpanded()">
    <div class="panel-content">
      <div class="panel-inner pt-3">
        
        <div class="chart-container d-flex justify-content-center mt-4 mb-4" style="position: relative; height: 160px; width: 100%">
          <canvas id="donutChart"></canvas>
          <div class="position-absolute top-50 start-50 translate-middle text-center" style="pointer-events: none;">
            <h2 class="m-0 text-white fw-black fs-1">{{ total() }}</h2>
            <span class="text-white-50 tiny-label">TOTAL</span>
          </div>
        </div>

        <div class="legend-list">
          <div class="stat-row type-success" 
               [class.active-filter]="filtroActual() === 'completado'"
               [class.is-inactive]="filtroActual() !== 'todos' && filtroActual() !== 'completado'"
               (click)="filtroActual() === 'completado' ? filtroSeleccionado.emit('todos') : filtroSeleccionado.emit('completado')"
               [style.--progress]="calcularPorcentaje(completados())">
            <div class="stat-bg-bar"></div> 
            <div class="stat-content">
              <span class="label"><i class="bi bi-trophy-fill text-success"></i> Completados</span>
              <span class="value">{{ completados() }}</span>
            </div>
          </div>

          <div class="stat-row type-primary" 
               [class.active-filter]="filtroActual() === 'jugando'"
               [class.is-inactive]="filtroActual() !== 'todos' && filtroActual() !== 'jugando'"
               (click)="filtroActual() === 'jugando' ? filtroSeleccionado.emit('todos') : filtroSeleccionado.emit('jugando')"
               [style.--progress]="calcularPorcentaje(jugando())">
            <div class="stat-bg-bar"></div>
            <div class="stat-content">
              <span class="label"><i class="bi bi-controller text-primary"></i> Jugando</span>
              <span class="value">{{ jugando() }}</span>
            </div>
          </div>

          <div class="stat-row type-warning" 
               [class.active-filter]="filtroActual() === 'pendiente'"
               [class.is-inactive]="filtroActual() !== 'todos' && filtroActual() !== 'pendiente'"
               (click)="filtroActual() === 'pendiente' ? filtroSeleccionado.emit('todos') : filtroSeleccionado.emit('pendiente')"
               [style.--progress]="calcularPorcentaje(pendientes())">
            <div class="stat-bg-bar"></div>
            <div class="stat-content">
              <span class="label"><i class="bi bi-clock-history text-warning"></i> Pendientes</span>
              <span class="value">{{ pendientes() }}</span>
            </div>
          </div>

          <div class="stat-row type-danger" 
               [class.active-filter]="filtroActual() === 'abandonado'"
               [class.is-inactive]="filtroActual() !== 'todos' && filtroActual() !== 'abandonado'"
               (click)="filtroActual() === 'abandonado' ? filtroSeleccionado.emit('todos') : filtroSeleccionado.emit('abandonado')"
               [style.--progress]="calcularPorcentaje(abandonados())">
            <div class="stat-bg-bar"></div>
            <div class="stat-content">
              <span class="label"><i class="bi bi-x-circle-fill text-danger"></i> Abandonados</span>
              <span class="value">{{ abandonados() }}</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
