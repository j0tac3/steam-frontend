<div class="slim-stats-container position-relative">
  
  <div class="d-flex align-items-center gap-3" (click)="togglePanel()" style="cursor: pointer; user-select: none;">
    <h3 class="m-0 text-white fw-bold fs-5">Mi Colección</h3>
    <span class="badge rounded-pill px-3 py-2" style="background: rgba(138, 58, 255, 0.15); color: #d8b4fe; border: 1px solid rgba(138, 58, 255, 0.3);">
      {{ total() }} juegos
    </span>
    <i class="bi text-white-50" [class.bi-chevron-down]="!isExpanded()" [class.bi-chevron-up]="isExpanded()"></i>
  </div>

  <div class="premium-progress mt-2">
    <div class="bar success" [style.width]="calcularPorcentaje(completados())"></div>
    <div class="bar primary" [style.width]="calcularPorcentaje(jugando())"></div>
    <div class="bar warning" [style.width]="calcularPorcentaje(pendientes())"></div>
    <div class="bar danger" [style.width]="calcularPorcentaje(abandonados())"></div>
  </div>

  <div class="stats-dropdown-floating" [class.show]="isExpanded()">
    <div class="chart-container d-flex justify-content-center mb-3" style="position: relative; height: 140px; width: 100%">
      <canvas id="donutChart"></canvas>
      <div class="position-absolute top-50 start-50 translate-middle text-center" style="pointer-events: none;">
        <h2 class="m-0 text-white fw-black fs-3">{{ total() }}</h2>
      </div>
    </div>

    <div class="legend-list">
      <div class="stat-row type-success" [class.active-filter]="filtroActual() === 'completado'" (click)="filtroActual() === 'completado' ? filtroSeleccionado.emit('todos') : filtroSeleccionado.emit('completado')" [style.--progress]="calcularPorcentaje(completados())">
        <div class="stat-bg-bar"></div> <div class="stat-content"><span class="label"><i class="bi bi-trophy-fill text-success"></i> Completados</span><span class="value">{{ completados() }}</span></div>
      </div>
      <div class="stat-row type-primary" [class.active-filter]="filtroActual() === 'jugando'" (click)="filtroActual() === 'jugando' ? filtroSeleccionado.emit('todos') : filtroSeleccionado.emit('jugando')" [style.--progress]="calcularPorcentaje(jugando())">
        <div class="stat-bg-bar"></div> <div class="stat-content"><span class="label"><i class="bi bi-controller text-primary"></i> Jugando</span><span class="value">{{ jugando() }}</span></div>
      </div>
      <div class="stat-row type-warning" [class.active-filter]="filtroActual() === 'pendiente'" (click)="filtroActual() === 'pendiente' ? filtroSeleccionado.emit('todos') : filtroSeleccionado.emit('pendiente')" [style.--progress]="calcularPorcentaje(pendientes())">
        <div class="stat-bg-bar"></div> <div class="stat-content"><span class="label"><i class="bi bi-clock-history text-warning"></i> Pendientes</span><span class="value">{{ pendientes() }}</span></div>
      </div>
      <div class="stat-row type-danger" [class.active-filter]="filtroActual() === 'abandonado'" (click)="filtroActual() === 'abandonado' ? filtroSeleccionado.emit('todos') : filtroSeleccionado.emit('abandonado')" [style.--progress]="calcularPorcentaje(abandonados())">
        <div class="stat-bg-bar"></div> <div class="stat-content"><span class="label"><i class="bi bi-x-circle-fill text-danger"></i> Abandonados</span><span class="value">{{ abandonados() }}</span></div>
      </div>
    </div>
  </div>

</div>
