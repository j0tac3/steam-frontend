<div class="stats-glass-card mb-4 w-100">
  
  <div class="header-area d-flex justify-content-between align-items-start mb-3" 
      (click)="filtroSeleccionado.emit('todos')"
      [class.active-filter]="filtroActual() === 'todos'">
    <div>
      <h3 class="m-0 text-white fw-bold">Mi Colección</h3>
      <p class="m-0 text-white-50 small">Total: <strong class="text-white">{{ total() }}</strong> juegos <span class="fs-7 opacity-50">(clic para ver todos)</span></p>
    </div>
    
    <span class="fs-3 text-white-50">
      <app-icon name="icon-layers"></app-icon>
    </span>
  </div>

  <div class="premium-progress">
    <div class="bar success" [style.width]="calcularPorcentaje(completados())"></div>
    <div class="bar primary" [style.width]="calcularPorcentaje(jugando())"></div>
    <div class="bar warning" [style.width]="calcularPorcentaje(pendientes())"></div>
    <div class="bar danger" [style.width]="calcularPorcentaje(abandonados())"></div>
  </div>

  <div class="chart-container d-flex justify-content-center my-4" style="position: relative; height: 160px; width: 100%">
    <canvas id="donutChart"></canvas>
    
    <div class="position-absolute top-50 start-50 translate-middle text-center" style="pointer-events: none;">
      <h2 class="m-0 fw-bolder text-white">{{ total() }}</h2>
      <span class="text-white-50 small text-uppercase fw-bold" style="font-size: 0.65rem;">Total</span>
    </div>
  </div>

  <div class="legend-grid">
    <div class="stat-pill" 
         [class.active-filter]="filtroActual() === 'completado'"
         [class.is-inactive]="filtroActual() !== 'todos' && filtroActual() !== 'completado'"
         (click)="filtroActual() === 'completado' ? filtroSeleccionado.emit('todos') : filtroSeleccionado.emit('completado')">
      <span class="label"><span class="dot dot-success"></span> Completados</span>
      <span class="value">{{ completados() }}</span>
    </div>

    <div class="stat-pill" 
         [class.active-filter]="filtroActual() === 'jugando'"
         [class.is-inactive]="filtroActual() !== 'todos' && filtroActual() !== 'jugando'"
         (click)="filtroActual() === 'jugando' ? filtroSeleccionado.emit('todos') : filtroSeleccionado.emit('jugando')">
      <span class="label"><span class="dot dot-primary"></span> Jugando</span>
      <span class="value">{{ jugando() }}</span>
    </div>

    <div class="stat-pill" 
         [class.active-filter]="filtroActual() === 'pendiente'"
         [class.is-inactive]="filtroActual() !== 'todos' && filtroActual() !== 'pendiente'"
         (click)="filtroActual() === 'pendiente' ? filtroSeleccionado.emit('todos') : filtroSeleccionado.emit('pendiente')">
      <span class="label"><span class="dot dot-warning"></span> Pendientes</span>
      <span class="value">{{ pendientes() }}</span>
    </div>

    <div class="stat-pill" 
         [class.active-filter]="filtroActual() === 'abandonado'"
         [class.is-inactive]="filtroActual() !== 'todos' && filtroActual() !== 'abandonado'"
         (click)="filtroActual() === 'abandonado' ? filtroSeleccionado.emit('todos') : filtroSeleccionado.emit('abandonado')">
      <span class="label"><span class="dot dot-danger"></span> Abandonados</span>
      <span class="value">{{ abandonados() }}</span>
    </div>
  </div>
</div>
